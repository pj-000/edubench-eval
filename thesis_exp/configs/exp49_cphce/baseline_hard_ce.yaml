experiment: Exp49-CPHCE
variant: b0_hard_ce
target: rounded_label_5
loss: hard_cross_entropy
split: thesis_exp/data/splits/paper_like_triple_seed42
input_builder: thesis_exp.src.edujudge.exp02.build_exp02_dataset.make_prompt
input_fields: [question, answer, metric_canonical]
model: Qwen3-Reranker-0.6B
num_labels: 5
max_length: 2048
epochs: 10
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.05
lr_scheduler_type: cosine
per_device_train_batch_size: 4
gradient_accumulation_steps: 32
effective_batch_size: 128
per_device_eval_batch_size: 4
max_grad_norm: 1.0
gradient_checkpointing: true
checkpoint_rule: highest_dev_exact_tie_earlier_epoch
inference: raw_logit_argmax
seeds: [42, 43, 44]
test_during_training: false
