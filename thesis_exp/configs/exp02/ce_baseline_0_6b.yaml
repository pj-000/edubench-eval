# Exp2 CE baseline configuration template.
#
# This file documents the intended run settings. The shell script reads the
# model path from MODEL_NAME_OR_PATH so the exact 0.6B checkpoint can be supplied
# on the GPU server without editing code.

experiment_name: exp02_edubench_evaluator_0_6b_ce_baseline
model_name_or_path: ${MODEL_NAME_OR_PATH}

data:
  source_split_dir: thesis_exp/data/splits/paper_like_triple_seed42
  built_data_dir: thesis_exp/outputs/exp02_ce_baseline/data
  train_rows_expected: 2654
  dev_rows_expected: 664
  test_rows_expected: 2218
  template_name: qa_metric_baseline
  input_fields:
    - question
    - answer
    - metric_canonical
  excluded_from_text:
    - rubric
    - subject
    - scenario
    - education_level
    - language
    - generator_model
    - metric_group

objective:
  type: sequence_classification
  num_labels: 5
  target: label_5
  loss: unweighted_cross_entropy
  note: low-score-sensitive weighting is reserved for Exp5, not Exp2.

train:
  max_length: 2048
  num_train_epochs: 10
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 32
  per_device_eval_batch_size: 4
  max_grad_norm: 1.0
  seed: 42
  bf16: auto
  fp16_env_flag: FP16=1
  gradient_checkpointing: true
  checkpoint_selection: validation_accuracy
  effective_batch_size: 128

output:
  output_dir: thesis_exp/outputs/exp02_ce_baseline
  checkpoint_output_dir: thesis_exp/artifacts/exp02_ce_baseline/checkpoints/edubench_evaluator_0_6b_ce
  metrics_summary: thesis_exp/outputs/exp02_ce_baseline/tables/metrics_summary.csv
  per_bin_metrics: thesis_exp/outputs/exp02_ce_baseline/tables/per_bin_metrics.csv
  low_score_metrics: thesis_exp/outputs/exp02_ce_baseline/tables/low_score_metrics.csv
  high_score_metrics: thesis_exp/outputs/exp02_ce_baseline/tables/high_score_metrics.csv
  predictions_test: thesis_exp/outputs/exp02_ce_baseline/predictions/predictions_test.jsonl
  arrays_npz: thesis_exp/outputs/exp02_ce_baseline/arrays/exp02_dev_test_arrays.npz
