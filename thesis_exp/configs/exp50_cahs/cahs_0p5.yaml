experiment: Exp50-CAHS-0.5
variant: c1_cahs_0p5
alpha: 0.5
target: 0.5_onehot_label_plus_0.5_three_human_empirical_distribution
loss: soft_cross_entropy_weight_1p0
split: thesis_exp/data/splits/paper_like_triple_seed42
input_builder: thesis_exp.src.edujudge.exp02.build_exp02_dataset.make_prompt
input_fields: [question, answer, metric_canonical]
model: Qwen3-Reranker-0.6B
num_labels: 5
max_length: 2048
epochs: 10
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.05
lr_scheduler_type: cosine
per_device_train_batch_size: 4
gradient_accumulation_steps: 32
effective_batch_size: 128
per_device_eval_batch_size: 4
max_grad_norm: 1.0
gradient_checkpointing: true
checkpoint_rule: highest_dev_exact_tie_earlier_epoch
inference: raw_logit_argmax
scout_seed: 42
formal_seeds: [42, 43, 44]
alpha_search: forbidden
test_during_scout_or_formal: false
