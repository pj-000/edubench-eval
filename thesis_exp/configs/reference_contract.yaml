pdf_audit_corpus:
  dataset_name: edubench_audit_human_scored_subset
  not_full_official_edubench: true
  expected_total_scored_items: 5536
  expected_generator_models:
    - deepseek-r1
    - qwen-max
    - qwen2.5-7b-instruct
    - deepseek-v3
    - qwen2.5-14b-instruct
  expected_canonical_metrics: 12
  expected_canonical_scenarios: 9
  expected_canonical_subjects: 25
  expected_education_levels: 6
  expected_languages:
    - en
    - zh
  expected_train_pool_rows: 3318
  expected_heldout_test_rows: 2218
  split_granularity: question_answer_metric_triple

score_mapping:
  ten_to_five:
    "1,2": 1
    "3,4": 2
    "5,6": 3
    "7,8": 4
    "9,10": 5
